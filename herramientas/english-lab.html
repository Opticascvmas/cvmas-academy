<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Lab · Academia CV+</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00B9D6; --cyan-dark:#0099B5; --cyan-light:#E0F7FA;
  --dark:#0D2137; --dark2:#1A3350; --gold:#F5B800;
  --white:#fff; --bg:#F0F4F8; --gray-light:#E8EDF2; --gray-mid:#B0BEC5;
  --gray-text:#546E7A; --text:#1A2A3A; --ok:#00C853; --bad:#F44336; --warn:#FF9800;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;padding-bottom:40px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}

/* ── Encabezado ── */
.eltop{background:linear-gradient(135deg,var(--dark) 0%,var(--dark2) 100%);
  border-radius:16px;padding:20px 24px;color:#fff;position:relative;overflow:hidden}
.eltop:after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(0,185,214,.16)}
.eltop h1{font-size:1.35rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eltop p{color:#9db4c9;font-size:.86rem;margin-top:6px;max-width:640px;line-height:1.5}
.elbadge{background:var(--gold);color:var(--dark);font-size:.7rem;font-weight:700;
  padding:3px 10px;border-radius:20px;letter-spacing:.4px}

/* ── Niveles ── */
.niveles{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.niv{flex:1;min-width:150px;background:#fff;border:2px solid var(--gray-light);border-radius:12px;
  padding:11px 14px;cursor:pointer;transition:.16s;text-align:left}
.niv:hover{border-color:var(--cyan);transform:translateY(-2px)}
.niv.on{border-color:var(--cyan);background:var(--cyan-light);box-shadow:0 4px 14px rgba(0,185,214,.18)}
.niv b{display:block;font-size:.82rem;color:var(--dark)}
.niv span{font-size:.7rem;color:var(--gray-text)}

/* ── Modos ── */
.modos{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap;
  background:#fff;padding:7px;border-radius:12px;border:1px solid var(--gray-light)}
.modo{border:none;background:transparent;font-family:inherit;font-size:.79rem;font-weight:600;
  color:var(--gray-text);padding:9px 13px;border-radius:9px;cursor:pointer;transition:.15s}
.modo:hover{background:var(--gray-light);color:var(--dark)}
.modo.on{background:var(--cyan);color:#fff;box-shadow:0 3px 10px rgba(0,185,214,.3)}

/* ── Tarjetas ── */
.card{background:#fff;border-radius:14px;padding:20px;border:1px solid var(--gray-light);
  box-shadow:0 2px 10px rgba(13,33,55,.05);margin-bottom:16px}
.card h2{font-size:1.02rem;color:var(--dark);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:.79rem;color:var(--gray-text);margin-bottom:16px;line-height:1.5}
.hint{background:#FFF9E6;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;
  padding:11px 14px;font-size:.8rem;color:#6b5200;line-height:1.55;margin:12px 0}
.hint b{color:#4a3800}

/* ── Frase grande ── */
.frase{text-align:center;padding:22px 14px 8px}
.frase .en{font-size:1.6rem;font-weight:700;color:var(--dark);line-height:1.3}
.frase .fon{font-size:.92rem;color:var(--cyan-dark);font-weight:600;margin-top:9px;letter-spacing:.3px}
.frase .es{font-size:.86rem;color:var(--gray-text);margin-top:7px;font-style:italic}
.controles{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;font-family:inherit;font-size:.82rem;font-weight:600;padding:11px 18px;
  border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:active{transform:scale(.97)}
.btn-c{background:var(--cyan);color:#fff}.btn-c:hover{background:var(--cyan-dark)}
.btn-g{background:var(--gold);color:var(--dark)}.btn-g:hover{background:#e0a800}
.btn-o{background:#fff;color:var(--dark);border:2px solid var(--gray-light)}
.btn-o:hover{border-color:var(--cyan);color:var(--cyan-dark)}
.btn-d{background:var(--dark);color:#fff}.btn-d:hover{background:var(--dark2)}
.btn.rec{background:var(--bad);color:#fff;animation:lat 1s infinite}
@keyframes lat{50%{opacity:.55}}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Resultado de pronunciación ── */
.resul{margin-top:18px;border-radius:12px;padding:15px 17px;display:none;text-align:left}
.resul.ok{background:#E8F8EE;border:1px solid #A5E0BC}
.resul.med{background:#FFF6E5;border:1px solid #F5D48A}
.resul.no{background:#FDECEA;border:1px solid #F5B7B1}
.resul .pct{font-size:1.6rem;font-weight:800;line-height:1}
.resul.ok .pct{color:#0a7d3c}.resul.med .pct{color:#946200}.resul.no .pct{color:#a02c1f}
.resul .oiste{font-size:.8rem;color:var(--gray-text);margin-top:7px}
.resul .oiste i{color:var(--text);font-style:normal;font-weight:600}
.pal{display:inline-block;padding:2px 7px;margin:3px 3px 0 0;border-radius:6px;
  font-size:.78rem;font-weight:600}
.pal.b{background:#C8ECD5;color:#0a6b34}.pal.m{background:#F8D7DA;color:#8a231a}

/* ── Barra de progreso / racha ── */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:110px;background:#fff;border:1px solid var(--gray-light);
  border-radius:12px;padding:12px 14px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--cyan-dark);font-weight:800}
.stat span{font-size:.68rem;color:var(--gray-text);text-transform:uppercase;letter-spacing:.5px}
.barra{height:8px;background:var(--gray-light);border-radius:20px;overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));
  border-radius:20px;transition:width .4s}
.paso{font-size:.72rem;color:var(--gray-mid);text-align:center;margin-top:8px;letter-spacing:.4px}

/* ── Sonidos ── */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.son{background:#fff;border:2px solid var(--gray-light);border-radius:12px;padding:15px;
  cursor:pointer;transition:.16s}
.son:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,185,214,.15)}
.son .sim{font-size:1.5rem;font-weight:800;color:var(--cyan-dark)}
.son .nom{font-size:.78rem;font-weight:700;color:var(--dark);margin-top:2px}
.son .ej{font-size:.72rem;color:var(--gray-text);margin-top:5px}
.boca{background:var(--dark);color:#dbe7f1;border-radius:12px;padding:15px 17px;
  font-size:.83rem;line-height:1.6;margin:12px 0}
.boca b{color:var(--gold)}
.pares{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.par{flex:1;min-width:130px;background:var(--cyan-light);border:2px solid #B2E7F0;
  border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
.par:hover{border-color:var(--cyan)}
.par b{display:block;font-size:1rem;color:var(--dark)}
.par span{font-size:.7rem;color:var(--gray-text)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{background:#fff;border:1.5px solid var(--gray-light);border-radius:20px;
  padding:6px 13px;font-size:.78rem;font-weight:600;color:var(--dark);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--cyan);background:var(--cyan-light)}

/* ── Conjugador ── */
.selv{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=text]{font-family:inherit;font-size:.85rem;padding:10px 13px;
  border:2px solid var(--gray-light);border-radius:10px;background:#fff;color:var(--text);outline:none}
select:focus,input[type=text]:focus{border-color:var(--cyan)}
.tabla{width:100%;border-collapse:collapse;margin-top:10px;font-size:.83rem}
.tabla th{background:var(--dark);color:#fff;text-align:left;padding:9px 12px;font-size:.75rem;
  font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tabla th:first-child{border-radius:8px 0 0 0}.tabla th:last-child{border-radius:0 8px 0 0}
.tabla td{padding:9px 12px;border-bottom:1px solid var(--gray-light)}
.tabla tr:hover td{background:#F7FBFC}
.tabla .eng{font-weight:600;color:var(--dark)}
.tabla .esp{color:var(--gray-text);font-size:.79rem}
.tabla .spk{cursor:pointer;color:var(--cyan-dark);font-size:1rem;user-select:none}
.ttitulo{font-size:.8rem;font-weight:700;color:var(--cyan-dark);
  text-transform:uppercase;letter-spacing:.6px;margin:20px 0 4px}
.regla{background:var(--cyan-light);border-radius:10px;padding:12px 15px;font-size:.81rem;
  line-height:1.6;color:#0a4652;margin:10px 0}
.regla b{color:#063a45}

/* ── Diálogos ── */
.dlg{background:#F7FAFC;border-radius:12px;padding:6px;margin-top:12px}
.lin{display:flex;gap:11px;padding:11px 13px;border-radius:10px;margin-bottom:5px;align-items:flex-start}
.lin.cli{background:#fff;border:1px solid var(--gray-light)}
.lin.yo{background:var(--cyan-light);border:1px solid #B2E7F0}
.lin .qui{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  min-width:62px;padding-top:3px}
.lin.cli .qui{color:var(--gray-text)}.lin.yo .qui{color:var(--cyan-dark)}
.lin .txt{flex:1}
.lin .txt .en{font-size:.88rem;font-weight:600;color:var(--dark)}
.lin .txt .es{font-size:.75rem;color:var(--gray-text);font-style:italic;margin-top:2px}
.lin .txt .fon{font-size:.72rem;color:var(--cyan-dark);font-weight:600;margin-top:2px}
.lin .acc{display:flex;gap:5px;flex-shrink:0}
.mini{border:none;background:#fff;border:1.5px solid var(--gray-light);border-radius:8px;
  width:32px;height:32px;cursor:pointer;font-size:.85rem;transition:.15s}
.mini:hover{border-color:var(--cyan);background:var(--cyan-light)}
.mini.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:lat 1s infinite}

/* ── Flashcards ── */
.fc{perspective:1200px;margin:14px auto;max-width:430px}
.fcin{position:relative;width:100%;height:210px;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.fcara{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.fcfr{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff}
.fcfr .w{font-size:1.7rem;font-weight:700}
.fcfr .f{font-size:.85rem;color:var(--gold);margin-top:8px;font-weight:600}
.fcfr .t{font-size:.68rem;color:#7f97ad;margin-top:16px;letter-spacing:.5px}
.fcde{background:linear-gradient(135deg,var(--cyan),var(--cyan-dark));color:#fff;transform:rotateY(180deg)}
.fcde .w{font-size:1.4rem;font-weight:700}
.fcde .u{font-size:.8rem;margin-top:12px;opacity:.92;line-height:1.5;font-style:italic}

/* ── Dictado / quiz de escucha ── */
.dictado{text-align:center;padding:10px 0}
.dictado input{width:100%;max-width:460px;text-align:center;font-size:1rem;font-weight:600;margin-top:14px}
.vok{color:var(--ok);font-weight:700}.vno{color:var(--bad);font-weight:700}

/* ── Avisos ── */
.aviso{background:#FDECEA;border:1px solid #F5B7B1;color:#8a231a;border-radius:10px;
  padding:12px 15px;font-size:.79rem;line-height:1.55;margin-bottom:14px;display:none}
.aviso.show{display:block}
.velo{display:flex;align-items:center;gap:9px;font-size:.76rem;color:var(--gray-text);
  justify-content:center;margin-top:14px;flex-wrap:wrap}
.velo input[type=range]{width:130px;accent-color:var(--cyan)}
.hide{display:none!important}
@media(max-width:600px){
  .frase .en{font-size:1.25rem}
  .eltop h1{font-size:1.1rem}
  .lin{flex-wrap:wrap}
  .lin .qui{min-width:auto}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="eltop">
    <h1>🇺🇸 English Lab <span class="elbadge">ACADEMIA CV+</span></h1>
    <p>Aprende inglés como si hubieras nacido allá: primero el <b>oído</b>, después la boca, y al final la
       gramática. Escucha la voz nativa, repite en voz alta y el laboratorio te califica la pronunciación.</p>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="niveles" id="niveles"></div>

  <div class="modos" id="modos"></div>

  <div id="panel"></div>

</div>
<script>
/* ═══════════════════════════════════════════════════════════════
   ENGLISH LAB · Academia CV+
   Contenido por niveles. Para agregar material solo edita este
   objeto DATA: la interfaz se dibuja sola.
   ═══════════════════════════════════════════════════════════════ */
const DATA = {

/* ────────────────────────── NIVEL 1 ────────────────────────── */
1:{
 nombre:"Nivel 1 · Survival English",
 corto:"Sonidos y primeras frases",
 sonidos:[
  {sim:"TH", nom:"th sonora y sorda /θ/ /ð/",
   ej:"think · thanks · the",
   boca:"Este sonido <b>no existe en español</b> y es la marca #1 de un acento extranjero. Saca la punta de la lengua entre los dientes y sopla. En <b>think</b> y <b>thanks</b> solo sale aire (sorda). En <b>the</b>, <b>this</b>, <b>that</b> la garganta vibra (sonora). Nunca lo cambies por T ni por S: si dices <i>sink</i> en vez de <i>think</i>, dijiste 'lavamanos'.",
   palabras:["think","thanks","three","this","that","the","mother","birthday"],
   pares:[{a:"think",b:"sink",na:"pensar",nb:"lavamanos"},{a:"three",b:"tree",na:"tres",nb:"árbol"}]},

  {sim:"H", nom:"h aspirada /h/",
   ej:"hello · help · how",
   boca:"En español la H es muda; en inglés <b>siempre suena</b>, como un suspiro suave desde el pecho. Pon la mano frente a la boca: debes sentir el aire tibio. Ojo con el error contrario: <b>hour</b>, <b>honest</b> y <b>honor</b> son las excepciones donde sí es muda.",
   palabras:["hello","help","how","have","here","happy","hi"],
   pares:[{a:"heat",b:"eat",na:"calor",nb:"comer"},{a:"hi",b:"eye",na:"hola",nb:"ojo"}]},

  {sim:"V/B", nom:"v labiodental /v/",
   ej:"very · vision · have",
   boca:"En español B y V suenan igual. En inglés son distintas y confundirlas cambia palabras. Para la <b>V</b> muerde suavemente el labio inferior con los dientes de arriba y haz vibrar: <b>vvvv</b>. Para la <b>B</b> los dos labios se juntan y explotan. Practica: <i>very</i> (muy) vs <i>berry</i> (fruta).",
   palabras:["very","vision","have","glasses have","five","seven","invoice"],
   pares:[{a:"very",b:"berry",na:"muy",nb:"baya"},{a:"vest",b:"best",na:"chaleco",nb:"lo mejor"}]},

  {sim:"R", nom:"r americana /ɹ/",
   ej:"red · ready · here",
   boca:"La R en inglés <b>no vibra</b> como en español (nada de 'rr'). La lengua se enrolla hacia atrás <b>sin tocar</b> el paladar, y los labios se redondean un poco, como si fueras a decir 'u'. Truco: piensa en el gruñido de un perro suave, no en el motor de una moto.",
   palabras:["red","ready","right","frame","here","repair","doctor"],
   pares:[{a:"right",b:"light",na:"correcto",nb:"luz"},{a:"free",b:"flee",na:"gratis",nb:"huir"}]},

  {sim:"ə", nom:"schwa · la vocal perezosa",
   ej:"about · problem · doctor",
   boca:"Es el sonido <b>más común del inglés</b> y el secreto del ritmo nativo. En las sílabas sin acento, la vocal se relaja hasta convertirse en un 'e' apagada: <b>about</b> = /ə-BÁUT/, <b>problem</b> = /PRÁ-blem/, <b>doctor</b> = /DÁK-ter/. El error típico del hispanohablante es pronunciar todas las vocales claras y fuertes; en inglés solo <b>una</b> sílaba brilla y el resto se apaga.",
   palabras:["about","problem","doctor","customer","again","support","banana"],
   pares:[{a:"customer",b:"cus-to-mer",na:"KAS-te-mer (nativo)",nb:"kus-to-mer (marcado)"}]},

  {sim:"S-", nom:"s líquida al inicio",
   ej:"school · Spanish · store",
   boca:"En español no arrancamos palabras con S + consonante, así que agregamos una 'e': <i>escuela</i>, <i>español</i>. En inglés <b>nunca</b> pongas esa 'e'. Es <b>school</b>, no 'eschool'; <b>store</b>, no 'estore'. Empieza directamente con el silbido de la serpiente.",
   palabras:["school","Spanish","store","start","stop","special","street"],
   pares:[{a:"store",b:"e-store",na:"correcto",nb:"acento marcado"}]},

  {sim:"iː/ɪ", nom:"vocal larga vs corta",
   ej:"see · sit",
   boca:"El español tiene 5 vocales; el inglés tiene más de 12. La <b>i larga</b> (see, eat, feel) se estira con la sonrisa amplia. La <b>i corta</b> (sit, fit, this) es breve y relajada, casi entre 'i' y 'e'. Es la diferencia entre <i>sheet</i> y otra palabra que no querrás decirle a un cliente.",
   palabras:["see","sit","eat","it","feel","fill","cheap","chip"],
   pares:[{a:"see",b:"sit",na:"ver",nb:"sentarse"},{a:"feel",b:"fill",na:"sentir",nb:"llenar"}]}
 ],
 frases:[
  {en:"Good morning! Welcome to CV Plus.",es:"¡Buenos días! Bienvenido a CV Plus.",fon:"gud MOR-ning · UÉL-com tu si-vi PLAS"},
  {en:"Good afternoon! How can I help you?",es:"¡Buenas tardes! ¿Cómo puedo ayudarle?",fon:"gud af-ter-NUN · jáu can ai JELP iu"},
  {en:"My name is Oscar. Nice to meet you.",es:"Mi nombre es Oscar. Gusto en conocerle.",fon:"mai néim is OS-car · náis tu MIT iu"},
  {en:"How are you today?",es:"¿Cómo está hoy?",fon:"jáu ar iu tu-DÉI"},
  {en:"I'm sorry, could you repeat that, please?",es:"Disculpe, ¿podría repetir eso, por favor?",fon:"áim SÓ-ri · cud iu ri-PIT dat plis"},
  {en:"Just a moment, please.",es:"Un momento, por favor.",fon:"yast a MÓU-ment plis"},
  {en:"Thank you very much!",es:"¡Muchas gracias!",fon:"zénk iu VÉ-ri match"},
  {en:"You're welcome.",es:"De nada.",fon:"iur UÉL-com"},
  {en:"Please, have a seat.",es:"Por favor, tome asiento.",fon:"plis · jav a SIT"},
  {en:"Do you speak Spanish?",es:"¿Habla español?",fon:"du iu SPIK SPÁ-nish"},
  {en:"I speak a little English.",es:"Hablo un poco de inglés.",fon:"ai spik a LÍ-tel ÍN-glish"},
  {en:"One moment, I'll call my supervisor.",es:"Un momento, llamaré a mi supervisor.",fon:"uán MÓU-ment · ail col mai SU-per-vái-ser"},
  {en:"Here you go.",es:"Aquí tiene.",fon:"jir iu GÓU"},
  {en:"Have a nice day!",es:"¡Que tenga un buen día!",fon:"jav a náis DÉI"},
  {en:"See you soon. Goodbye!",es:"Nos vemos pronto. ¡Adiós!",fon:"si iu SUN · gud-BÁI"}
 ],
 verbos:[
  {inf:"to be",es:"ser / estar",nota:"El verbo más usado del inglés. Los nativos casi siempre lo dicen contraído (I'm, you're, it's). Aprende la contracción primero: eso es lo que de verdad se escucha en la calle.",
   tiempos:{
    "Afirmativo":[["I am (I'm)","yo soy / estoy"],["You are (you're)","tú eres / estás"],["He is (he's)","él es / está"],["She is (she's)","ella es / está"],["It is (it's)","eso es / está"],["We are (we're)","nosotros somos / estamos"],["They are (they're)","ellos son / están"]],
    "Negativo":[["I am not (I'm not)","yo no soy / no estoy"],["You are not (you aren't)","tú no eres / no estás"],["He is not (he isn't)","él no es / no está"],["We are not (we aren't)","nosotros no somos / no estamos"],["They are not (they aren't)","ellos no son / no están"]],
    "Pregunta":[["Am I...?","¿soy / estoy...?"],["Are you...?","¿eres / estás...?"],["Is he...?","¿es / está él...?"],["Is it...?","¿es / está eso...?"],["Are we...?","¿somos / estamos...?"],["Are they...?","¿son / están ellos...?"]]
   }},
  {inf:"to have",es:"tener",nota:"Se usa para lo que el cliente o la tienda posee. Solo cambia en la tercera persona: he/she/it → has.",
   tiempos:{
    "Afirmativo":[["I have","yo tengo"],["You have","tú tienes"],["He has","él tiene"],["She has","ella tiene"],["It has","eso tiene"],["We have","nosotros tenemos"],["They have","ellos tienen"]],
    "Negativo":[["I don't have","yo no tengo"],["He doesn't have","él no tiene"],["We don't have","nosotros no tenemos"]],
    "Pregunta":[["Do you have...?","¿tienes...?"],["Does he have...?","¿tiene él...?"],["Do you have your prescription?","¿tiene su receta?"]]
   }},
  {inf:"can",es:"poder",nota:"Es un modal: nunca lleva 's' y el verbo que le sigue va en infinitivo sin 'to'. La forma cortés para atender es 'How can I help you?'.",

3:{

 sonidos:[
  {sim:"-ed", nom:"las 3 pronunciaciones de -ed",
   ej:"worked · called · wanted",
   boca:"Este es el detalle que <b>delata al 100%</b> a quien aprendió inglés en libro. El '-ed' del pasado tiene tres sonidos y ninguno es 'ed' salvo en el tercer caso:<br>• Sonido sordo antes (k, p, f, s, sh, ch) → <b>/t/</b>: <i>worked</i> = 'uerkt', <i>helped</i> = 'jelpt'.<br>• Sonido sonoro o vocal antes → <b>/d/</b>: <i>called</i> = 'cold', <i>tried</i> = 'traid'.<br>• Solo si termina en <b>t</b> o <b>d</b> → <b>/ɪd/</b> y suma una sílaba: <i>wanted</i> = 'UÁN-tid', <i>needed</i> = 'NÍ-did'.",
   palabras:["worked","helped","looked","called","tried","ordered","wanted","needed","waited"],
   pares:[{a:"worked",b:"work-ed",na:"uerkt (correcto)",nb:"UÉR-ked (marcado)"},{a:"wanted",b:"wantd",na:"UÁN-tid",nb:"uantd"}]},
  {sim:"↓", nom:"vocales que cambian en el pasado",
   ej:"see→saw · come→came",
   boca:"Los verbos irregulares no cambian solo la escritura: cambian el <b>sonido de la vocal</b>, y ahí está el reto del oído. Escucha el salto: <i>see /si/ → saw /so/</i>, <i>come /kam/ → came /kéim/</i>, <i>find /fáind/ → found /fáund/</i>, <i>buy /bái/ → bought /bot/</i>. Aprende el par completo como si fuera una sola palabra doble.",
   palabras:["see - saw","come - came","find - found","buy - bought","take - took","tell - told","give - gave"],
   pares:[{a:"came",b:"come",na:"kéim (pasado)",nb:"kam (presente)"}]},
  {sim:"'ll", nom:"la contracción del futuro",
   ej:"I'll · we'll · they'll",
   boca:"Nadie dice 'I will call you' en la vida real; se dice <b>I'll</b> y suena casi como 'ail', una sola sílaba. Igual: <i>we'll</i> = 'uil', <i>he'll</i> = 'jil', <i>they'll</i> = 'déil'. Si pronuncias el 'will' completo suenas formal o robótico. Y para 'going to' los nativos dicen <b>gonna</b>: 'I'm gonna check' = áim GÁ-na chek.",
   palabras:["I'll call you","we'll have it ready","they'll be here","I'm gonna check","it's gonna be ready"],

<script>
/* ═══════════════════════════════════════════════════════════════
   MOTOR DEL LABORATORIO
   ═══════════════════════════════════════════════════════════════ */
var ST = {
  nivel: 1,
  modo: "sonidos",
  velocidad: 0.85,
  iFrase: 0, iSon: 0, iDlg: 0, iCard: 0, iDict: 0, iVerbo: 0,
  flip: false,
  grabando: false
};

/* ── Progreso local ── */
var PROG = (function(){
  try { return JSON.parse(localStorage.getItem("cvp_english_lab") || "{}"); }
  catch(e){ return {}; }
})();
function guardarProg(){
  try { localStorage.setItem("cvp_english_lab", JSON.stringify(PROG)); } catch(e){}
}
function nivProg(n){
  if(!PROG["n"+n]) PROG["n"+n] = { intentos:0, suma:0, mejor:0, racha:0, hechas:{} };
  return PROG["n"+n];
}
function registrar(pct, clave){
  var p = nivProg(ST.nivel);
  p.intentos++; p.suma += pct;
  if(pct > p.mejor) p.mejor = pct;
  if(pct >= 75){ p.racha++; } else { p.racha = 0; }
  if(clave) p.hechas[clave] = Math.max(p.hechas[clave]||0, pct);
  guardarProg();
}

var VOZ = null;

  if(!window.speechSynthesis) return;

  var pref = ["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Microsoft Zira",

    }
  }
  for(var k=0;k<vs.length;k++){ if((vs[k].lang||"").indexOf("en")===0){ VOZ = vs[k]; return; } }

/* ═══════════ RECONOCIMIENTO DE VOZ (micrófono) ═══════════ */
var REC_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
var rec = null;
function escuchar(onListo, onError){
  if(!REC_OK){ if(onError) onError("no-soporte"); return; }
  try{
    var R = window.SpeechRecognition || window.webkitSpeechRecognition;
    rec = new R();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.continuous = false;
    var listo = false;
    rec.onresult = function(ev){
      listo = true;
      var alts = [];
      for(var i=0;i<ev.results[0].length;i++) alts.push(ev.results[0][i].transcript);
      onListo(alts);
    };
    rec.onerror = function(ev){ if(onError) onError(ev.error||"error"); };
    rec.onend = function(){ if(!listo && onError) onError("silencio"); };
    rec.start();
  }catch(e){ if(onError) onError("error"); }
}
function pararEscucha(){ try{ if(rec) rec.stop(); }catch(e){} }

/* ═══════════ CALIFICACIÓN DE PRONUNCIACIÓN ═══════════ */
function normal(s){
  return (s||"").toLowerCase()
    .replace(/['’´]/g,"")                       /* I'm → im  (sin partir la palabra) */
    .replace(/[.,!?;:"“”()\-—]/g," ")
    .replace(/\s+/g," ").trim();
}
/* Equivalencias: formas contraídas y reducciones que el reconocedor puede
   escribir de dos maneras. Se aplican igual a lo esperado y a lo escuchado,
   así que nunca penalizan al alumno. */
var EQUIV = {
  "gonna":"going to","wanna":"want to","gotta":"got to","lemme":"let me","gimme":"give me",
  "whaddaya":"what do you","cause":"because","ok":"okay","yeah":"yes","yep":"yes","nope":"no",
  "im":"i am","ive":"i have","ill":"i will","id":"i would","youre":"you are","youve":"you have",
  "hes":"he is","shes":"she is","its":"it is","were":"we are","weve":"we have","well":"we will",
  "theyre":"they are","theyve":"they have","theres":"there is","thats":"that is","whats":"what is",
  "lets":"let us","dont":"do not","doesnt":"does not","didnt":"did not","isnt":"is not",
  "arent":"are not","wasnt":"was not","werent":"were not","cant":"can not","cannot":"can not",
  "wont":"will not","wouldnt":"would not","couldnt":"could not","shouldnt":"should not",
  "havent":"have not","hasnt":"has not","aint":"is not"
};
function expandir(s){
  var w = normal(s).split(" "), out=[];
  for(var i=0;i<w.length;i++){ out.push(EQUIV[w[i]] ? EQUIV[w[i]] : w[i]); }
  return out.join(" ").split(" ").filter(function(x){return x.length>0;});
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
/* Estricto a propósito en palabras cortas: si aceptáramos "tree" como "three"
   el laboratorio dejaría pasar justo el error que estamos enseñando a corregir.
   La tolerancia solo aplica a palabras largas (plurales, terminaciones). */
function parecidas(a,b){
  if(a===b) return true;
  var L = Math.max(a.length,b.length);
  if(L < 6) return false;
  var d = lev(a,b);
  return L >= 9 ? d <= 2 : d <= 1;
}
/* alinea palabra por palabra y devuelve % + marcas */
function calificar(esperado, dicho){
  var A = expandir(esperado), B = expandir(dicho);
  var m=A.length, n=B.length, i, j;
  var T=[]; for(i=0;i<=m;i++){ T[i]=[]; for(j=0;j<=n;j++) T[i][j]=0; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    T[i][j] = parecidas(A[i-1],B[j-1]) ? T[i-1][j-1]+1 : Math.max(T[i-1][j], T[i][j-1]);
  /* reconstruir qué palabras se lograron */
  var ok = {}; i=m; j=n;
  while(i>0 && j>0){
    if(parecidas(A[i-1],B[j-1]) && T[i][j]===T[i-1][j-1]+1){ ok[i-1]=true; i--; j--; }
    else if(T[i-1][j] >= T[i][j-1]) i--; else j--;
  }
  var aciertos = T[m][n];
  var pct = m ? Math.round(aciertos*100/m) : 0;
  /* penaliza si dijo muchísimo de más */
  if(n > m*1.8) pct = Math.max(0, pct-10);
  var marcas=[]; for(i=0;i<A.length;i++) marcas.push({w:A[i], ok:!!ok[i]});
  return { pct:pct, marcas:marcas, dicho:B.join(" ") };
}
function claseRes(p){ return p>=85 ? "ok" : (p>=60 ? "med" : "no"); }
function tituloRes(p){
  if(p>=95) return "🏆 Perfecto — sonaste nativo";
  if(p>=85) return "✅ ¡Muy bien! Te entenderían sin problema";
  if(p>=70) return "👍 Casi. Repite marcando las palabras en rojo";
  if(p>=50) return "🔁 Vas por buen camino, escucha otra vez y repite";
  return "🎧 Escucha de nuevo y repite más despacio";
}
function pintaResultado(cajaId, esperado, alts, tip){
  var mejor = null;
  for(var i=0;i<alts.length;i++){
    var r = calificar(esperado, alts[i]);
    if(!mejor || r.pct > mejor.pct) mejor = r;
  }
  var box = document.getElementById(cajaId);
  if(!box) return null;
  box.className = "resul " + claseRes(mejor.pct);
  var pal = "";
  for(var k=0;k<mejor.marcas.length;k++){
    pal += '<span class="pal '+(mejor.marcas[k].ok?"b":"m")+'">'+mejor.marcas[k].w+'</span>';
  }
  box.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<span class="pct">'+mejor.pct+'%</span>'+
      '<span style="font-size:.86rem;font-weight:600">'+tituloRes(mejor.pct)+'</span>'+
    '</div>'+
    '<div style="margin-top:10px">'+pal+'</div>'+
    '<div class="oiste">El micrófono escuchó: <i>'+(mejor.dicho||"(nada)")+'</i></div>'+
    (tip ? '<div class="oiste" style="margin-top:6px">💡 '+tip+'</div>' : "");
  box.style.display = "block";
  return mejor;
}
function pintaError(cajaId, err){
  var box = document.getElementById(cajaId); if(!box) return;
  box.className = "resul no";
  var msg = "No pude escucharte. ";
  if(err==="not-allowed" || err==="service-not-allowed")
    msg = "El navegador bloqueó el micrófono. Toca el candado 🔒 en la barra de direcciones y permite el micrófono.";
  else if(err==="silencio" || err==="no-speech")
    msg = "No escuché nada. Habla más cerca del micrófono y con voz clara.";
  else if(err==="no-soporte")
    msg = "Este navegador no evalúa pronunciación. Usa Google Chrome en la computadora.";
  else msg += "Intenta otra vez.";
  box.innerHTML = '<div style="font-size:.84rem;font-weight:600">🎤 '+msg+'</div>';
  box.style.display = "block";
}

    }

  var tabs = "";
  for(var i=0;i<d.dialogos.length;i++){
    tabs += '<button class="chip" style="'+(i===ST.iDlg?"border-color:var(--cyan);background:var(--cyan-light)":"")+
            '" onclick="ST.iDlg='+i+';pintar()">'+esc(d.dialogos[i].titulo)+'</button>';
  }
  var lineas = "";
  for(var j=0;j<dl.lineas.length;j++){
    var L = dl.lineas[j];
    var yo = L.q === "yo";
    lineas +=
      '<div class="lin '+(yo?"yo":"cli")+'">'+
        '<div class="qui">'+(yo?"TÚ":"CLIENTE")+'</div>'+
        '<div class="txt">'+
          '<div class="en">'+esc(L.en)+'</div>'+
          '<div class="fon">'+esc(L.fon)+'</div>'+
          '<div class="es">'+esc(L.es)+'</div>'+
        '</div>'+
        '<div class="acc">'+
          '<button class="mini" title="Escuchar" onclick="decir(\''+L.en.replace(/'/g,"\\'")+'\')">🔊</button>'+
          (yo && REC_OK ? '<button class="mini" id="mic'+j+'" title="Practicar mi línea" onclick="micLinea('+j+')">🎤</button>' : "")+
        '</div>'+
      '</div>'+
      (yo ? '<div class="resul" id="resL'+j+'" style="margin:0 0 8px 12px"></div>' : "");
  }
  return barraStats()+
  '<div class="card">'+
    '<h2>💬 Diálogos reales de la óptica</h2>'+
    '<div class="sub">Practica el guion completo. Las líneas <b>celestes son tuyas</b>: toca el micrófono y dilas '+
      'en voz alta como si el cliente estuviera enfrente. Las blancas son del cliente, solo escúchalas.</div>'+
    '<div class="chips">'+tabs+'</div>'+
    '<div class="dlg">'+lineas+'</div>'+
    '<div class="controles">'+
      '<button class="btn btn-c" onclick="leerDialogo()">▶ Escuchar el diálogo completo</button>'+
      '<button class="btn btn-o" onclick="ST.iDlg=(ST.iDlg+1)%nivelActual().dialogos.length;pintar()">Siguiente diálogo →</button>'+
    '</div>'+
    controlVel()+
  '</div>';
}
function leerDialogo(){
  var dl = nivelActual().dialogos[ST.iDlg], i = 0;
  function sig(){
    if(i >= dl.lineas.length) return;
    var L = dl.lineas[i]; i++;
    if(!window.speechSynthesis){ return; }
    try{
      var u = new SpeechSynthesisUtterance(L.en);
      u.lang="en-US"; u.rate=ST.velocidad; if(VOZ) u.voice=VOZ;
      u.pitch = L.q==="yo" ? 1.05 : 0.9;
      u.onend = function(){ setTimeout(sig, 320); };
      speechSynthesis.speak(u);
    }catch(e){}
  }
  try{ speechSynthesis.cancel(); }catch(e){}
  sig();
}
function micLinea(j){
  var L = nivelActual().dialogos[ST.iDlg].lineas[j];
  var b = q("mic"+j); if(b){ b.className="mini rec"; b.textContent="🔴"; }
  escuchar(function(alts){
    if(b){ b.className="mini"; b.textContent="🎤"; }
    var r = pintaResultado("resL"+j, L.en, alts, "Guía: "+L.fon);
    if(r) registrar(r.pct, "dl"+ST.iDlg+"_"+j);
    pintaNiveles();
  }, function(err){
    if(b){ b.className="mini"; b.textContent="🎤"; }
    pintaError("resL"+j, err);
  });
}

/* ═══════════ MODO 5 · FLASHCARDS ═══════════ */
function vistaCards(){
  var d = nivelActual(), c = d.cards[ST.iCard];
  var pct = Math.round((ST.iCard+1)*100/d.cards.length);
  return barraStats()+
  '<div class="card">'+
    '<h2>🃏 Vocabulario con audio</h2>'+
    '<div class="sub">Toca la tarjeta para voltearla. Regla de oro: <b>nunca leas la palabra sin escucharla</b>, '+
      'o vas a guardar en tu memoria una pronunciación inventada que después cuesta borrar.</div>'+
    '<div class="fc'+(ST.flip?" flip":"")+'" onclick="ST.flip=!ST.flip;pintar()">'+
      '<div class="fcin">'+
        '<div class="fcara fcfr">'+
          '<div class="w">'+esc(c.en)+'</div>'+
          '<div class="f">'+esc(c.fon)+'</div>'+
          '<div class="t">TOCA PARA VER EL SIGNIFICADO</div>'+
        '</div>'+
        '<div class="fcara fcde">'+
          '<div class="w">'+esc(c.es)+'</div>'+
          '<div class="u">"'+esc(c.uso)+'"</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="controles">'+
      '<button class="btn btn-c" onclick="event.stopPropagation();decir(\''+c.en.replace(/'/g,"\\'")+'\')">🔊 La palabra</button>'+
      '<button class="btn btn-o" onclick="event.stopPropagation();decir(\''+c.uso.replace(/'/g,"\\'")+'\')">🔊 La frase completa</button>'+
      (REC_OK ? '<button class="btn btn-g" id="btnMic" onclick="event.stopPropagation();micCard()">🎤 Repetir la frase</button>' : "")+
    '</div>'+
    '<div class="resul" id="res"></div>'+
    '<div class="barra"><i style="width:'+pct+'%"></i></div>'+
    '<div class="paso">TARJETA '+(ST.iCard+1)+' DE '+d.cards.length+'</div>'+
    '<div class="controles" style="margin-top:14px">'+
      '<button class="btn btn-o" onclick="navCard(-1)">← Anterior</button>'+
      '<button class="btn btn-d" onclick="navCard(1)">Siguiente →</button>'+
    '</div>'+
  '</div>';
}
function navCard(dir){
  var d = nivelActual();
  ST.iCard = (ST.iCard + dir + d.cards.length) % d.cards.length;
  ST.flip = false; pintar();
}
function micCard(){
  var c = nivelActual().cards[ST.iCard];
  var b = q("btnMic"); if(b){ b.className="btn rec"; b.textContent="🔴 Habla ahora..."; }
  escuchar(function(alts){
    if(b){ b.className="btn btn-g"; b.textContent="🎤 Repetir la frase"; }
    var r = pintaResultado("res", c.uso, alts, null);
    if(r) registrar(r.pct, "cd"+ST.iCard);
    pintaNiveles();
  }, function(err){
    if(b){ b.className="btn btn-g"; b.textContent="🎤 Repetir la frase"; }
    pintaError("res", err);
  });
}

/* ═══════════ MODO 6 · DICTADO ═══════════ */
function vistaDictado(){
  var d = nivelActual();
  var pct = Math.round((ST.iDict+1)*100/d.frases.length);
  return barraStats()+
  '<div class="card">'+
    '<h2>🎧 Dictado · entrena el oído</h2>'+
    '<div class="sub">Aquí <b>no se ve la frase</b>. Escucha y escribe lo que oigas. Este ejercicio es el que '+
      'más rápido te hace entender a un cliente hablando a velocidad real.</div>'+
    '<div class="dictado">'+
      '<div class="controles">'+
        '<button class="btn btn-c" onclick="decir(\''+d.frases[ST.iDict].en.replace(/'/g,"\\'")+'\')">▶ Escuchar</button>'+
        '<button class="btn btn-o" onclick="decir(\''+d.frases[ST.iDict].en.replace(/'/g,"\\'")+'\',0.55)">🐢 Despacio</button>'+
      '</div>'+
      '<input type="text" id="dictIn" placeholder="Escribe aquí lo que escuchaste..." autocomplete="off" '+
        'onkeydown="if(event.key===\'Enter\')revisarDictado()">'+
      '<div class="controles" style="margin-top:12px">'+
        '<button class="btn btn-g" onclick="revisarDictado()">✔ Revisar</button>'+
        '<button class="btn btn-d" onclick="navDict(1)">Siguiente →</button>'+
      '</div>'+
    '</div>'+
    '<div class="resul" id="res"></div>'+
    controlVel()+
    '<div class="barra"><i style="width:'+pct+'%"></i></div>'+
    '<div class="paso">DICTADO '+(ST.iDict+1)+' DE '+d.frases.length+'</div>'+
    '<div class="hint"><b>Si no entendiste nada:</b> es normal al inicio y no significa que no sepas inglés. '+
      'Significa que el oído todavía no separa las palabras pegadas. Escucha 5 veces seguidas antes de rendirte, '+
      'y luego bájale la velocidad.</div>'+
  '</div>';
}
function navDict(dir){
  var d = nivelActual();
  ST.iDict = (ST.iDict + dir + d.frases.length) % d.frases.length;
  pintar();
}
function revisarDictado(){
  var f = nivelActual().frases[ST.iDict];
  var val = (q("dictIn")||{}).value || "";
  var r = calificar(f.en, val);
  var box = q("res");
  box.className = "resul " + claseRes(r.pct);
  var pal = "";
  for(var k=0;k<r.marcas.length;k++){
    pal += '<span class="pal '+(r.marcas[k].ok?"b":"m")+'">'+r.marcas[k].w+'</span>';
  }
  box.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<span class="pct">'+r.pct+'%</span>'+
      '<span style="font-size:.86rem;font-weight:600">'+(r.pct>=85?"✅ ¡Excelente oído!":(r.pct>=60?"👍 Casi, revisa lo rojo":"🎧 Escucha otra vez"))+'</span>'+
    '</div>'+
    '<div style="margin-top:10px">'+pal+'</div>'+
    '<div class="oiste">Era: <i>'+esc(f.en)+'</i></div>'+
    '<div class="oiste">Significa: '+esc(f.es)+'</div>';
  box.style.display = "block";
  registrar(r.pct, "dt"+ST.iDict);
  pintaNiveles();
  if(r.pct>=85) setTimeout(function(){ navDict(1); }, 2400);
}

/* ═══════════ PINTAR ═══════════ */
function pintar(){
  var h = "";
  if(ST.modo==="sonidos")        h = vistaSonidos();
  else if(ST.modo==="frases")    h = vistaFrases();
  else if(ST.modo==="conjugador")h = vistaConjugador();
  else if(ST.modo==="dialogos")  h = vistaDialogos();
  else if(ST.modo==="cards")     h = vistaCards();
  else if(ST.modo==="dictado")   h = vistaDictado();
  q("panel").innerHTML = h;
}

/* ═══════════ ARRANQUE ═══════════ */
(function(){
  /* nivel por URL: english-lab.html?nivel=2 */
  var m = (location.search||"").match(/nivel=(\d)/);
  if(m && DATA[parseInt(m[1])]) ST.nivel = parseInt(m[1]);

  var avisos = [];
  if(!window.speechSynthesis)
    avisos.push("Este navegador no tiene voz sintetizada, así que no podrás escuchar el audio nativo. Usa <b>Google Chrome</b>.");
  if(!REC_OK)
    avisos.push("La evaluación de pronunciación por micrófono solo funciona en <b>Google Chrome</b> (computadora o Android). "+
                "En iPad o iPhone puedes escuchar y repetir, pero no se calificará tu voz.");
  if(location.protocol === "file:")
    avisos.push("Estás abriendo el archivo directamente desde el disco. El micrófono se bloquea así; "+
                "cuando esté publicado en el sitio de la Academia funcionará normal.");
  if(avisos.length){
    var a = q("aviso");
    a.innerHTML = "⚠️ " + avisos.join("<br><br>⚠️ ");
    a.className = "aviso show";
  }

  pintaNiveles();
  pintaModos();
  pintar();

  /* algunos navegadores solo cargan las voces después de la primera interacción */
  document.addEventListener("click", function once(){
    elegirVoz();
    document.removeEventListener("click", once);
  });
})();
</script>
</body>
</html>
