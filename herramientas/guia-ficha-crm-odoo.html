<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía Programa de Lealtad y Reactivación (SUMÁS)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style id="css">/* Guía paso a paso con marca CV+: portada con 3 bloques de procesos; cada proceso se abre "acercándose" desde su tarjeta. Tema claro único de marca. */
:root{
  --cian:#00abc8; --cian-o:#006b7e; --cian-s:#e5f6f9; --oro:#ffc629; --oro-s:#fff6dd; --carbon:#373a36; --gris:#535651;
  --fondo:#d6e4e9; --fondo-s:#f1f6f7; --blanco:#ffffff; --linea:#c3d3d9; --ok:#2e9e5b; --ok-s:#e7f5ec; --crit:#d64545; --crit-s:#fdeaea;
  --edit-bg:#fffcf0; --edit-bd:#f0d98a;
  --f:'Poppins','Segoe UI',Arial,sans-serif; --ease:cubic-bezier(.65,.05,.25,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--carbon);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cian);outline-offset:2px}
b,strong{font-weight:600}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* ---- Encabezado ---- */
.cab{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0 10px}
.cab .logo{height:40px;width:auto;display:block}
.cab .esp{flex:1}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid #c9d3d6;background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--carbon)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:var(--oro);border-color:var(--oro);font-weight:600}
.btn.cian{border-color:var(--cian);color:var(--cian-o)}
.sync{font-size:11px;color:var(--gris);background:#fff;border-radius:999px;padding:4px 10px}
#btnDescartar{display:none}
body.editando #btnDescartar{display:inline-block}
.editbar{display:none;background:var(--oro);font-size:13px;padding:8px 14px;border-radius:12px;margin:6px 0 4px;text-align:center}
body.editando .editbar{display:block}

.hero{background:#fff;border-radius:24px;padding:28px 30px;margin-top:8px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;box-shadow:0 4px 18px rgba(30,60,70,.12)}
.hero .eyb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cian-o);font-weight:600;margin:0 0 6px}
.hero h1{font-size:clamp(24px,3.6vw,34px);line-height:1.12;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;color:var(--gris);max-width:58ch}
.prog{background:var(--cian-s);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.prog .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--cian-o)}
.prog .v{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.barra{height:10px;background:#fff;border-radius:999px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--cian);border-radius:999px;transition:width .8s var(--ease)}
.prog small{color:var(--gris);font-size:12px}

/* ---- Bloques y tarjetas ---- */
.bloque{margin-top:30px}
.bloque h2{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
.bloque h2 .bn{width:34px;height:34px;border-radius:10px;background:var(--carbon);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.bloque > p{margin:4px 0 14px 44px;color:var(--gris);font-size:14px}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tarj{position:relative;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:20px;padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;min-width:0}
.tarj:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,171,200,.14);border-color:var(--cian)}
.tarj:active{transform:scale(.98)}
.tarj .tn{width:38px;height:38px;border-radius:50%;background:var(--cian);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
.tarj h3{font-size:16px;line-height:1.3;margin:0}
.tarj p{margin:0;font-size:13px;color:var(--gris)}
.tarj .meta{margin-top:auto;font-size:12px;color:var(--cian-o);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.tarj .hecho{display:none;color:var(--ok)}
.tarj.ok{border-color:#bfe3cc;background:linear-gradient(#fff,#fff) padding-box}
.tarj.ok .tn{background:var(--ok)}
.tarj.ok .hecho{display:inline}
.pie{margin-top:36px;font-size:12px;color:var(--gris);text-align:center}

/* ---- Vista de proceso (se acerca desde la tarjeta) ---- */
#vista{position:fixed;inset:0;z-index:30;background:var(--fondo);overflow:auto;display:none;overscroll-behavior:contain}
#vista.abierta{display:block}
.vbar{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.97);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.vbar .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vbar .migas{flex:1;min-width:0;font-size:13px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .migas b{color:var(--carbon)}
.vcont{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
.vhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.vhead .tn{width:52px;height:52px;border-radius:50%;background:var(--cian);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.vhead h2{font-size:clamp(22px,3.2vw,30px);line-height:1.15;margin:2px 0 6px;text-wrap:balance}
.vhead p{margin:0;color:var(--gris)}
.vhead .bl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cian-o);font-weight:600}
.pasos{position:relative;display:flex;flex-direction:column;gap:18px}
.paso{position:relative;background:#fff;border-radius:20px;padding:20px 22px 20px 74px;box-shadow:0 4px 18px rgba(30,60,70,.12);min-width:0}
.paso .pn{position:absolute;left:18px;top:18px;width:40px;height:40px;border-radius:50%;background:var(--carbon);color:#fff;display:grid;place-items:center;font-weight:700}
.paso .pk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cian-o);font-weight:600}
.paso h3{font-size:18px;margin:2px 0 10px;line-height:1.3}
.paso > .it{margin:0 0 12px}
.paso > .it:last-child{margin-bottom:0}
.paso ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.paso li::marker{color:var(--cian)}
figure{margin:4px 0 0}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ficha{border-radius:14px;padding:12px 14px;background:var(--fondo-s);border:1px solid var(--linea);border-top:5px solid var(--c,var(--cian))}
.ficha h4{margin:0 0 4px;font-size:14px;line-height:1.3}
.ficha p{margin:0;font-size:13px;color:#454843}
.f-cobre{--c:#b8733d}.f-plata{--c:#a3abb0}.f-oro{--c:var(--oro)}
.f-t1{--c:#f59e0b}.f-t2{--c:#e4572e}.f-t3{--c:#7fb7c9}.f-t4{--c:#2f6f9f}
.f-leal{--c:var(--ok)}.f-prim{--c:var(--cian)}.f-dir{--c:var(--carbon)}.f-comp{--c:#8a6a00}
.cap{border-radius:14px;border:1.5px solid var(--linea);overflow:hidden;background:#fff;cursor:zoom-in;display:inline-block;padding:0;max-width:100%;vertical-align:top;transition:box-shadow .3s,transform .3s var(--ease)}
.cap:hover{box-shadow:0 10px 26px rgba(0,0,0,.12);transform:translateY(-2px)}
.cap img{display:block;max-width:100%;width:auto;height:auto}
figcaption{font-size:13px;color:var(--gris);margin-top:6px}
.nota,.ojo{border-radius:14px;padding:12px 16px;font-size:14px}
.nota{background:var(--cian-s)}
.ojo{background:var(--oro-s);border:1.5px solid #f3dd94}
.nota::before{content:'Nota · ';font-weight:600;color:var(--cian-o)}
.ojo::before{content:'Importante · ';font-weight:600;color:#8a6a00}
.vfin{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:24px;background:#fff;border-radius:20px;padding:16px 18px}
.vfin .btn{font-size:14px;padding:10px 18px;white-space:normal;max-width:100%;text-align:center}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}

/* animaciones de entrada del contenido */
.entra .vhead,.entra .paso,.entra .vfin{animation:sube .6s var(--ease) both}
.entra .paso:nth-child(1){animation-delay:.08s}.entra .paso:nth-child(2){animation-delay:.14s}.entra .paso:nth-child(3){animation-delay:.2s}
.entra .paso:nth-child(4){animation-delay:.26s}.entra .paso:nth-child(5){animation-delay:.32s}.entra .paso:nth-child(6){animation-delay:.38s}
@keyframes sube{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.desliza-izq{animation:dizq .5s var(--ease) both}
.desliza-der{animation:dder .5s var(--ease) both}
@keyframes dizq{from{opacity:0;transform:translateX(60px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dder{from{opacity:0;transform:translateX(-60px) scale(.98)}to{opacity:1;transform:none}}

/* ---- Lupa de capturas ---- */
#lupa{position:fixed;inset:0;z-index:50;background:rgba(30,32,30,.86);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lupa.ver{display:flex;animation:fade .25s ease}
#lupa img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:crece .35s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes crece{from{transform:scale(.9);opacity:.4}}

/* ---- Edición ---- */
.vguard{display:none;gap:8px}
body.editando .vguard{display:inline-flex}
.vedit{display:none;background:var(--oro);font-size:12px;text-align:center;padding:6px 14px}
body.editando .vedit{display:block}
body.editando [contenteditable="true"]{background:var(--edit-bg);outline:1.5px dashed var(--edit-bd);outline-offset:3px;border-radius:4px;min-height:1.3em;cursor:text}
body.editando [contenteditable="true"]:focus{outline:2.5px solid var(--oro);background:#fff}
body.editando .cap{cursor:default}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--carbon);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.solo-editor{display:none}
body.editor .solo-editor{display:flex}
body.editor .sync.solo-editor{display:inline-block}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:22px 18px}
  .paso{padding:18px 16px 18px 16px}
  .paso .pn{position:static;margin-bottom:8px}
  .bloque > p{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.ctrls,.editbar,.vbar,.vfin{display:none!important}}
.cap[data-img="ficha_botones_flujos"]{width:520px}.cap[data-img="ficha_botones_flujos"] img{width:100%}
</style>
</head>

     '<div class="prog"><span class="k" data-edit="cab.avk">'+T('cab.avk','Tu avance')+'</span><span class="v" id="pv">0 de '+PR.length+'</span><div class="barra"><i id="pb" style="width:0"></i></div>'+ed('cab.avs','Marca cada proceso como completado al terminar de leerlo.','small')+'</div></section>';
  G.bloques.forEach(function(b,bi){
    h+='<section class="bloque"><h2><span class="bn">'+(bi+1)+'</span>'+ed('b.'+b.id+'.n',b.nombre,'span')+'</h2>'+ed('b.'+b.id+'.d',b.desc,'p')+'<div class="tarjetas">';
    PR.forEach(function(p,i){ if(p.bloque!==b.id) return;
      h+='<button class="tarj" type="button" data-p="'+i+'"><span class="tn">'+(i+1)+'</span>'+ed('p.'+p.id+'.t',p.titulo,'h3')+ed('p.'+p.id+'.r',p.resumen,'p')+
         '<span class="meta"><span>'+p.pasos.length+' pasos</span><span class="hecho">✓ Completado</span></span></button>';
    });
    h+='</div></section>';
  });
  h+=ed('cab.pie','Ópticas CV+ · Guía Programa de Lealtad y Reactivación (SUMÁS) · Capturas del Odoo de pruebas, octubre de 2026','p','pie');
  app.innerHTML='<div class="wrap">'+h+'</div>'+
    '<div id="vista" role="dialog" aria-modal="true" aria-label="Proceso"></div>'+
    '<div id="lupa" aria-hidden="true"><img alt=""></div><div class="toast" id="toast" role="status"></div>';
  pintarAvance(); enlazar();
}
function pintarAvance(){
  var n=0; PR.forEach(function(p,i){var ok=!!OK[p.id]; if(ok)n++; var c=app.querySelector('.tarj[data-p="'+i+'"]'); if(c) c.classList.toggle('ok',ok);});
  var pv=D.getElementById('pv'),pb=D.getElementById('pb'); if(pv){pv.textContent=n+' de '+PR.length; pb.style.width=(n/PR.length*100)+'%';}
}

/* ---------- Proceso ---------- */
function htmlProceso(i){
  var p=PR[i], bl=bloqueDe(p), h='';
  h+='<div class="vbar"><div class="in"><button class="btn" type="button" data-acc="volver">← Todos los procesos</button>'+
     '<span class="migas">'+esc(bl.b.nombre)+' › <b>'+esc(strip(T('p.'+p.id+'.t',p.titulo)))+'</b></span>'+
     '<button class="btn" type="button" data-acc="ant" '+(i===0?'disabled':'')+' aria-label="Proceso anterior">←</button>'+
     '<span style="font-size:12px;color:var(--gris)">'+(i+1)+' / '+PR.length+'</span>'+
     '<button class="btn" type="button" data-acc="sig" '+(i===PR.length-1?'disabled':'')+' aria-label="Proceso siguiente">→</button>'+
     '<span class="vguard"><button class="btn" type="button" data-acc="descartar">Descartar</button><button class="btn prim" type="button" data-acc="guardar">Guardar cambios</button></span></div>'+
     '<div class="vedit">Modo edición: toca cualquier texto, paso, lista, nota o pie de captura para cambiarlo. Puedes pasar a otros procesos con ← → y guardar todo al final.</div></div>';
  h+='<div class="vcont" id="vcont"><div class="vhead"><span class="tn">'+(i+1)+'</span><div><span class="bl">Bloque '+(bl.i+1)+' · '+esc(bl.b.nombre)+'</span>'+
     ed('p.'+p.id+'.t',p.titulo,'h2')+ed('p.'+p.id+'.r',p.resumen,'p')+'</div></div><div class="pasos">';
  p.pasos.forEach(function(s,j){
    var base='p.'+p.id+'.s'+j;
    h+='<article class="paso"><span class="pn">'+(j+1)+'</span><span class="pk">Paso '+(j+1)+'</span>'+ed(base+'.t',s.t,'h3');
    s.items.forEach(function(it,k){
      var kk=base+'.i'+k;
      if(typeof it==='string') h+=ed(kk,it,'p','it');
      else if(it.lista){ h+='<ul class="it">'; it.lista.forEach(function(li,m){h+=ed(kk+'.'+m,li,'li');}); h+='</ul>'; }
      else if(it.img){ h+='<figure class="it"><button class="cap" type="button" data-img="'+it.img+'" aria-label="Ampliar captura"><img loading="lazy" src="'+IMG[it.img]+'" alt=""></button>'+ed(kk,it.cap,'figcaption')+'</figure>'; }
      else if(it.fichas){ h+='<div class="it fichas">'; it.fichas.forEach(function(f,m){h+='<div class="ficha f-'+f.c+'">'+ed(kk+'.'+m+'.t',f.t,'h4')+ed(kk+'.'+m+'.d',f.d,'p')+'</div>';}); h+='</div>'; }
      else if(it.nota) h+=ed(kk,it.nota,'div','it nota');
      else if(it.ojo) h+=ed(kk,it.ojo,'div','it ojo');
    });
    h+='</article>';
  });
  var ok=!!OK[p.id];
  h+='</div><div class="vfin"><button class="btn '+(ok?'ok':'prim')+'" type="button" data-acc="ok">'+(ok?'✓ Completado':'Marcar como completado')+'</button>'+
     (i<PR.length-1?'<button class="btn cian" type="button" data-acc="sig">Siguiente: '+esc(strip(T('p.'+PR[i+1].id+'.t',PR[i+1].titulo)))+' →</button>':'<button class="btn cian" type="button" data-acc="volver">Volver a todos los procesos</button>')+'</div></div>';
  return h;
}
function strip(html){var d=D.createElement('div');d.innerHTML=html;return d.textContent;}
var vista;
function abrir(i,desde){
  cur=i; vista=D.getElementById('vista');
  vista.innerHTML=htmlProceso(i); vista.scrollTop=0;
  if(editando) activarCampos(true);
  vista.classList.add('abierta'); D.body.style.overflow='hidden';
  var vc=D.getElementById('vcont');
  if(desde && !REDUCE && vista.animate){
    var r=desde.getBoundingClientRect(), W=innerWidth, H=innerHeight;
    var ini='inset('+r.top+'px '+(W-r.right)+'px '+(H-r.bottom)+'px '+r.left+'px round 20px)';
    vista.animate([{clipPath:ini,opacity:.6},{clipPath:'inset(0px 0px 0px 0px round 0px)',opacity:1}],{duration:620,easing:'cubic-bezier(.65,.05,.25,1)'});
    vc.classList.add('entra');
  } else vc.classList.add('entra');
  try{history.replaceState(null,'','#'+PR[i].id);}catch(e){}
}
function cambiar(i,dir){
  if(i<0||i>=PR.length) return;
  if(editando) cosechar();
  cur=i; vista.innerHTML=htmlProceso(i); vista.scrollTop=0;
  if(editando) activarCampos(true);
  D.getElementById('vcont').classList.add(dir>0?'desliza-izq':'desliza-der');
  try{history.replaceState(null,'','#'+PR[i].id);}catch(e){}
}
function cerrar(){
  if(!vista||!vista.classList.contains('abierta')) return;
  if(editando){ cosechar(); }
  var card=app.querySelector('.tarj[data-p="'+cur+'"]');
  var fin=function(){vista.classList.remove('abierta');vista.innerHTML='';D.body.style.overflow='';try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}};
  if(card && !REDUCE && vista.animate){
    card.scrollIntoView({block:'nearest'});
    var r=card.getBoundingClientRect(), W=innerWidth, H=innerHeight;
    var a=vista.animate([{clipPath:'inset(0px 0px 0px 0px round 0px)',opacity:1},{clipPath:'inset('+r.top+'px '+(W-r.right)+'px '+(H-r.bottom)+'px '+r.left+'px round 20px)',opacity:.4}],{duration:520,easing:'cubic-bezier(.65,.05,.25,1)'});
    a.onfinish=function(){fin(); card.animate([{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:300});};
  } else fin();
}

/* ---------- Eventos ---------- */
var enlazado=false;
function enlazar(){
  if(!enlazado){ enlazado=true;
  app.addEventListener('click',function(e){
    var t=e.target;
    var tarj=t.closest('.tarj'); if(tarj){if(editando)cosechar();abrir(+tarj.dataset.p,tarj);return;}
    var acc=t.closest('[data-acc]');
    if(acc){var a=acc.dataset.acc;
      if(a==='volver') cerrar();
      else if(a==='sig') cambiar(cur+1,1);
      else if(a==='ant') cambiar(cur-1,-1);
      else if(a==='guardar') guardar();
      else if(a==='descartar') descartar.call(acc);
      else if(a==='ok'){var id=PR[cur].id; OK[id]=!OK[id]; lsSet(LS_OK,OK); pintarAvance();
        acc.className='btn '+(OK[id]?'ok':'prim'); acc.textContent=OK[id]?'✓ Completado':'Marcar como completado'; if(OK[id]) aviso('Proceso marcado como completado');}
      return;}
    var cap=t.closest('.cap'); if(cap && !editando){var l=D.getElementById('lupa');l.querySelector('img').src=IMG[cap.dataset.img];l.classList.add('ver');l.setAttribute('aria-hidden','false');return;}
    if(t.closest('#lupa')){var l2=D.getElementById('lupa');l2.classList.remove('ver');l2.setAttribute('aria-hidden','true');}
  });
  }
  D.getElementById('btnEditar').addEventListener('click',entrarEdicion);
  D.getElementById('btnGuardar').addEventListener('click',guardar);
  D.getElementById('btnDescartar').addEventListener('click',descartar);
  D.getElementById('btnCopia').addEventListener('click',copia);
}
D.addEventListener('keydown',function(e){
  var l=D.getElementById('lupa');
  if(e.key==='Escape'){ if(l&&l.classList.contains('ver')){l.classList.remove('ver');return;} if(!editando) cerrar(); return; }
  if(editando||!vista||!vista.classList.contains('abierta')) return;
  var tg=(e.target.tagName||'').toLowerCase(); if(tg==='input'||tg==='textarea') return;
  if(e.key==='ArrowRight') cambiar(cur+1,1); else if(e.key==='ArrowLeft') cambiar(cur-1,-1);
});

/* ---------- Edición (Editar · Guardar · Generar copia) ---------- */
var editando=false,sucio=false,PEND={};
function activarCampos(on){D.querySelectorAll('[data-edit]').forEach(function(el){if(on&&el.closest('.tarj'))return;if(on){el.setAttribute('contenteditable','true');el.setAttribute('spellcheck','false');}else{el.removeAttribute('contenteditable');el.removeAttribute('spellcheck');}});}
function limpiar(html){
  var d=D.createElement('div');d.innerHTML=String(html==null?'':html);
  (function paso(n){[].slice.call(n.childNodes).forEach(function(x){
    if(x.nodeType===3)return; if(x.nodeType!==1){x.remove();return;}
    var tag=x.tagName.toLowerCase();paso(x);
    if(tag==='br')return;
    if(['b','strong','i','em'].indexOf(tag)>=0){[].slice.call(x.attributes).forEach(function(a){x.removeAttribute(a.name);});return;}
    while(x.firstChild)x.parentNode.insertBefore(x.firstChild,x); x.remove();});})(d);
  return d.innerHTML.replace(/\s+/g,' ').trim();
}
function cosechar(){D.querySelectorAll('[data-edit][contenteditable]').forEach(function(el){PEND[el.dataset.edit]=limpiar(el.innerHTML);});}
function entrarEdicion(){editando=true;sucio=false;PEND={};D.body.classList.add('editando');activarCampos(true);D.getElementById('btnEditar').disabled=true;aviso('Modo edición activado');}
function salirEdicion(){editando=false;sucio=false;PEND={};D.body.classList.remove('editando');activarCampos(false);D.getElementById('btnGuardar').disabled=true;D.getElementById('btnEditar').disabled=false;resetDesc();}
D.addEventListener('input',function(e){if(editando&&e.target.closest&&e.target.closest('[data-edit]')){sucio=true;D.getElementById('btnGuardar').disabled=false;}});
D.addEventListener('keydown',function(e){if(!editando)return;var el=e.target.closest&&e.target.closest('[data-edit]');if(el&&e.key==='Enter'&&/^(H1|H2|H3|H4|SPAN|FIGCAPTION)$/.test(el.tagName)){e.preventDefault();el.blur();}});
D.addEventListener('paste',function(e){if(!editando||!e.target.closest||!e.target.closest('[contenteditable="true"]'))return;e.preventDefault();D.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));});
function guardar(){
  cosechar(); for(var k in PEND) TXT[k]=PEND[k];
  var g=lsGet(LS_TXT)||{}; for(var k2 in PEND) g[k2]=PEND[k2]; lsSet(LS_TXT,g);
  salirEdicion(); var abierto=vista&&vista.classList.contains('abierta')?cur:-1;
  construir(); if(abierto>=0){abrir(abierto,null);} aviso('Cambios guardados en este navegador. Usa "Generar copia" para llevarlos a la Academia.');
}
var dT=null;
function resetDesc(){clearTimeout(dT);D.querySelectorAll('#btnDescartar,[data-acc="descartar"]').forEach(function(b){b.textContent='Descartar';b.dataset.c='';});}
function descartar(){var b=this;if(sucio&&b.dataset.c!=='1'){b.dataset.c='1';b.textContent='¿Descartar? Toca otra vez';dT=setTimeout(resetDesc,3500);return;}
  salirEdicion();var abierto=vista&&vista.classList.contains('abierta')?cur:-1;construir();if(abierto>=0)abrir(abierto,null);aviso('Cambios descartados');}
function hoyISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function copia(){
  if(editando){aviso('Guarda o descarta los cambios antes de generar la copia');return;}
  var css=D.getElementById('css').textContent;
  var parts=['logo-data','img-data','datos','js'].map(function(id){return D.getElementById(id);});
  var html='<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>Guía Programa de Lealtad y Reactivación (SUMÁS)</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">\n'+
    '<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n'+
    '<script id="logo-data">'+parts[0].textContent+'<\/script>\n'+
    '<script type="application/json" id="img-data">'+parts[1].textContent+'<\/script>\n'+
    '<script type="application/json" id="txt-data">'+JSON.stringify(TXT).replace(/</g,'\\u003c')+'<\/script>\n'+
    '<script id="datos">'+parts[2].textContent+'<\/script>\n'+
    '<script id="js">'+parts[3].textContent+'<\/script>\n</body>\n</html>\n';
  var nombre='guia-ficha-crm-odoo.html';
  if(dl){dl.save({filename:nombre,data:html}).then(function(){aviso('Copia generada: súbela a la carpeta herramientas de la Academia');}).catch(function(){aviso('No se pudo generar la copia en esta vista');});return;}
  try{var blob=new Blob([html],{type:'text/html'});var a=D.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;D.body.appendChild(a);a.click();a.remove();aviso('Copia generada: súbela a la carpeta herramientas de la Academia');}
  catch(e){aviso('No se pudo generar la copia en esta vista');}
}
var tt=null;function aviso(t){var el=D.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('ver');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('ver');},3200);}

var dl=null;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){dl=d||null;}).catch(function(){});}

construir();
var h=(location.hash||'').replace('#','');
for(var i=0;i<PR.length;i++) if(PR[i].id===h){abrir(i,null);break;}
})();
</script>
</body>
</html>
